name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'pc-web/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pc-web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android platform
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
        working-directory: pc-web
      - run: npx tsc --noEmit
        working-directory: pc-web
      - run: node --experimental-strip-types --test lib/ledger.test.ts lib/bill-import.test.ts
        working-directory: pc-web
      - run: npm run build:pages
        working-directory: pc-web
      - run: node android/prepare-assets.mjs
      - name: Build offline Android app
        run: gradle -p android --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: daily-ledger-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
