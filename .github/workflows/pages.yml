name: Publish Daily Ledger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pc-web/package-lock.json
      - run: npm ci
        working-directory: pc-web
      - run: npx tsc --noEmit
        working-directory: pc-web
      - run: node --experimental-strip-types --test lib/ledger.test.ts
        working-directory: pc-web
      - run: npm run build:pages
        working-directory: pc-web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pc-web/dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
